packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: set this to true or false
  mongodb-memory-server: set this to true or false

# Catálogo de versiones compartidas: una única versión por dependencia en todo el
# monorepo. Cumple el criterio de aceptación de F0-01 ("resuelve los cuatro workspaces
# sin duplicar dependencias") de forma verificable, no por convención.
catalog:
  # Lenguaje y tooling
  typescript: 5.9.3
  '@types/node': ^24.10.1
  tsx: ^4.20.6

  # Calidad
  eslint: ^10.10.0
  typescript-eslint: ^8.70.0
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.7
  vitest: ^5.0.1
  '@vitest/coverage-v8': ^5.0.1

  # Dominio compartido
  zod: ^4.6.5

  # Backend
  fastify: ^5.12.5
  mongodb: ^7.6.0

  # Frontend
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  vite: ^8.3.0
  '@vitejs/plugin-react': ^6.1.1

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.38'
  - '@tanstack/router-core@1.171.32'
  - jsdom@30.1.0

# Únicos paquetes con permiso para correr scripts de postinstall. Todo lo demás
# se instala sin ejecutar nada (spec §13 — dependencias).
onlyBuiltDependencies:
  - esbuild
  - mongodb-memory-server
