packages:
  - 'apps/*'
  - 'packages/*'

# Únicos paquetes con permiso para correr scripts de postinstall; todo lo demás se
# instala sin ejecutar nada (spec §13 — dependencias). Los dos lo necesitan de verdad:
# esbuild baja su binario nativo y mongodb-memory-server el mongod que usan los tests.
# Agregar una dependencia acá es una decisión, no un trámite.
allowBuilds:
  esbuild: true
  mongodb-memory-server: true

# Catálogo de versiones compartidas: una única versión por dependencia en todo el
# monorepo. Cumple el criterio de aceptación de F0-01 ("resuelve los cuatro workspaces
# sin duplicar dependencias") de forma verificable, no por convención.
catalog:
  # Lenguaje y tooling
  typescript: 6.0.3
  '@types/node': ^24.19.0
  tsx: ^4.23.15

  # Calidad
  eslint: ^10.11.0
  typescript-eslint: ^8.71.0
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.9
  vitest: ^5.0.2
  '@vitest/coverage-v8': ^5.0.2

  # Dominio compartido
  zod: ^4.6.5

  # Backend
  fastify: ^5.12.5
  mongodb: ^7.7.0

  # Frontend
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  vite: ^8.3.1
  '@vitejs/plugin-react': ^6.1.1

  # Landing (ADR-0013). Astro 7 usa la misma Vite 8 que la web: no se duplica.
  astro: ^7.3.5
  '@astrojs/check': ^0.9.10

# `astro` trae `http-cache-semantics` <=4.2.0, que `pnpm audit` marca como alta
# (GHSA-ch52-4w7c-c8xp: max-stale puede devolver respuestas cacheadas de otro usuario). El parche
# es la 4.3.0, y `astro` la admite (`^4.2.0`) pero el lockfile quedaba en la 4.2.0 por la antigüedad
# mínima. Se fuerza acá. Sacar el override cuando `astro` pida `^4.3.0` por su cuenta.
overrides:
  http-cache-semantics: ^4.3.0

minimumReleaseAgeExclude:
  - '@tanstack/react-router@1.170.38'
  - '@tanstack/router-core@1.171.32'
  - jsdom@30.1.0
  # Parche de seguridad de arriba, publicado el 2026-10-04 (mismo publicador que la 4.2.0, firmada
  # en el registro). Sacar cuando cumpla la antigüedad mínima.
  - http-cache-semantics@4.3.0
