name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Corre después del build: los tests importan los paquetes compilados.
      - name: Tests + coverage (>90%, spec §10)
        run: pnpm test:coverage

      # F0-06: el build de Storybook es parte del pipeline. Si una story rompe,
      # rompe el PR.
      - name: Build de Storybook
        run: pnpm --filter @wasabi-cross/ui build-storybook

  audit:
    name: audit de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # spec §13: `npm audit` en CI. Falla con vulnerabilidades altas o críticas.
      - name: Audit
        run: pnpm audit --audit-level high
