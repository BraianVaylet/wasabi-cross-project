name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Va primero: los tipos de @wasabi-cross/schemas y /ui salen de sus `dist`.
      # Sin compilarlos antes, el lint con tipos y el typecheck ven `any` en cada
      # import entre workspaces y fallan en cadena.
      - name: Build
        run: pnpm build

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests + coverage (>90%, spec §10)
        run: pnpm test:coverage

      # F0-06: el build de Storybook es parte del pipeline. Si una story rompe,
      # rompe el PR.
      - name: Build de Storybook
        run: pnpm --filter @wasabi-cross/ui build-storybook

  e2e:
    name: E2E + axe (spec §10 y §11)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # El front importa @wasabi-cross/ui y /schemas desde sus `dist`: sin build, el
      # servidor de desarrollo que levanta Playwright no resuelve nada.
      - name: Build
        run: pnpm build

      # El mongod efímero se baja una vez y se reusa entre corridas.
      - name: Caché del binario de Mongo
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Instalar Chromium
        run: pnpm --filter @wasabi-cross/web exec playwright install --with-deps chromium

      # Contra el build de producción: la API, sobre un Mongo efímero, sirviendo el front
      # compilado en el mismo origen, como va a correr en Railway (F3-05, ADR-0007).
      - name: E2E
        run: pnpm e2e:prod

      # F4-11: la captura de referencia del detalle es la de Linux (las fuentes se dibujan
      # distinto en cada sistema). Mientras no esté en el repo, el test se saltea y acá se
      # genera, para bajarla del artefacto y commitearla. Con la captura en el repo, este paso
      # no corre y el E2E compara contra ella.
      - name: Generar la captura de referencia, si falta
        if: hashFiles('apps/web/e2e/__capturas__/*-linux.png') == ''
        run: pnpm --filter @wasabi-cross/web exec playwright test -c playwright.prod.config.ts --grep @captura --update-snapshots

      - name: Subir la captura de referencia
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: captura-de-referencia
          path: apps/web/e2e/__capturas__
          if-no-files-found: ignore
          retention-days: 7

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  audit:
    name: audit de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # spec §13: `npm audit` en CI. Falla con vulnerabilidades altas o críticas.
      - name: Audit
        run: pnpm audit --audit-level high
